<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Project Reviewer</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
:root{--apr-good:var(--color-green);--apr-good-100:var(--color-green-100);--apr-good-800:var(--color-green-800);--apr-warn:oklch(0.72 0.13 80);--apr-bad:oklch(0.66 0.16 27);--apr-pad:var(--space-4);--apr-gap:var(--space-3)}
html[data-theme="light"]{
--color-bg:#f3f4fa;--color-surface:#ffffff;--color-text:#23252f;
--color-divider:color-mix(in srgb,#23252f 14%,transparent);
--color-accent:#6d5fc0;--color-accent-2:#7972a9;
--color-neutral-100:#292b31;--color-neutral-200:#3f424d;--color-neutral-300:#595d6c;--color-neutral-400:#75798c;--color-neutral-600:#b2b6ca;--color-neutral-700:#cfd3e5;--color-neutral-800:#e4e7f5;--color-neutral-900:#f3f5fe;
--color-accent-100:#2b2741;--color-accent-200:#423a6a;--color-accent-300:#5d5294;--color-accent-400:#796cbf;--color-accent-600:#b5abfc;--color-accent-700:#d2cefd;--color-accent-800:#e7e5fe;--color-accent-900:#f5f4ff;
--color-green:oklch(0.55 0.105 152);--color-green-100:oklch(0.26 0.045 152);--color-green-800:oklch(0.93 0.04 152);
--apr-warn:oklch(0.58 0.13 75);--apr-bad:oklch(0.55 0.16 27);
--shadow-sm:0 0 0 1px #e4e6f0;--shadow-md:0 0 0 1px #e4e6f0,0 6px 18px rgba(35,37,60,.08);--shadow-lg:0 0 0 1px #d8dbea,0 16px 40px rgba(35,37,60,.14)}
.apr-mono{--apr-good:var(--color-accent);--apr-good-100:var(--color-accent-100);--apr-good-800:var(--color-accent-800)}
.apr-cozy{--apr-pad:var(--space-6);--apr-gap:var(--space-4)}
body{transition:background .25s,color .25s}
@keyframes apr-spin{to{transform:rotate(360deg)}}
.apr-app{display:grid;grid-template-columns:228px 1fr;min-height:100vh}
.apr-pad{padding:var(--apr-pad)}
.apr-row{display:flex;align-items:center;gap:6px}
.apr-kicker{font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin:0;color:color-mix(in srgb,var(--color-text) 55%,transparent);display:flex;align-items:center;gap:5px}
/* sidebar */
.apr-side{display:flex;flex-direction:column;gap:var(--space-4);padding:var(--space-4) var(--space-3);border-right:1px solid var(--color-divider);position:sticky;top:0;height:100vh}
.apr-brand{display:flex;align-items:center;gap:9px;font-family:var(--font-heading);font-weight:500;font-size:15px;padding:2px 6px}
.apr-brandmark{width:28px;height:28px;display:grid;place-items:center;border-radius:var(--radius-sm);border:1px solid var(--apr-good);color:var(--apr-good)}
.apr-nav{display:flex;flex-direction:column;gap:2px}
.apr-nav-it{display:flex;align-items:center;gap:10px;padding:8px 10px;border:0;background:none;color:color-mix(in srgb,var(--color-text) 75%,transparent);font:inherit;font-size:14px;border-radius:var(--radius-md);cursor:pointer;text-align:left}
.apr-nav-it:hover{background:color-mix(in srgb,var(--color-text) 6%,transparent)}
.apr-nav-on,.apr-nav-on:hover{background:var(--color-surface);color:var(--color-text);box-shadow:inset 2px 0 0 var(--color-accent)}
.apr-protip{margin-top:auto}
.apr-user{display:flex;align-items:center;gap:9px;padding:6px}
.apr-avatar{width:32px;height:32px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--color-accent-800);color:var(--color-accent-100)}
/* top bar */
.apr-body{display:flex;flex-direction:column;min-width:0}
.apr-top{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-6);border-bottom:1px solid var(--color-divider);position:sticky;top:0;background:color-mix(in srgb,var(--color-bg) 88%,transparent);backdrop-filter:blur(8px);z-index:5}
.apr-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:4px 9px;border:1px solid var(--color-divider);border-radius:99px;color:color-mix(in srgb,var(--color-text) 70%,transparent)}
.apr-dot{width:7px;height:7px;border-radius:50%}
.apr-btn-sm{font-size:12px;padding:4px 9px}
/* review layout */
.apr-review{display:grid;grid-template-columns:252px minmax(0,1fr) 296px;gap:var(--apr-gap);padding:var(--apr-gap) var(--space-6) var(--space-8);align-items:start}
.apr-nopanel{grid-template-columns:252px minmax(0,1fr)}
.apr-rail{display:flex;flex-direction:column;gap:var(--space-3);position:sticky;top:64px}
.apr-rail-head{display:flex;align-items:center;justify-content:space-between}
.apr-search{display:flex;align-items:center;gap:7px;padding:0 10px;background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-md);color:color-mix(in srgb,var(--color-text) 55%,transparent)}
.apr-search-in{border:0;background:none;color:var(--color-text);font:inherit;font-size:13px;min-height:34px;width:100%;outline:none}
.apr-rail-list{display:flex;flex-direction:column;gap:var(--space-2)}
.apr-repo{display:flex;align-items:center;gap:10px;padding:10px;background:var(--color-surface);border:1px solid transparent;border-radius:var(--radius-md);cursor:pointer;font:inherit;color:inherit;text-align:left}
.apr-repo:hover{border-color:var(--color-divider)}
.apr-repo-sel,.apr-repo-sel:hover{border-color:var(--apr-good);box-shadow:0 0 14px color-mix(in srgb,var(--apr-good) 18%,transparent)}
.apr-repo-txt{flex:1;min-width:0}
.apr-repo-txt b{display:block;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.apr-repo-txt small{font-size:11px;color:color-mix(in srgb,var(--color-text) 50%,transparent)}
.apr-repoicon{flex:none;display:grid;place-items:center;border-radius:var(--radius-sm)}
.apr-rail-link{font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:5px;padding:2px 4px}
/* main column */
.apr-main{display:flex;flex-direction:column;gap:var(--apr-gap);min-width:0}
.apr-head{flex-direction:row;display:flex;gap:var(--space-4);align-items:center;justify-content:space-between}
.apr-ring{position:relative;text-align:center;flex:none}
.apr-ring-label{position:absolute;inset:0;bottom:22px;display:grid;place-content:center}
.apr-ring-label b{font-size:30px;font-weight:600;line-height:1}
.apr-ring-label span{font-size:11px;color:color-mix(in srgb,var(--color-text) 55%,transparent)}
.apr-ring-grade{font-size:12px;margin-top:-16px}
.apr-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:var(--space-3)}
.apr-sum-it{display:flex;gap:8px;align-items:flex-start}
.apr-sum-l{font-size:11px;color:color-mix(in srgb,var(--color-text) 55%,transparent)}
.apr-sum-v{font-size:13px}
.apr-tabs{display:flex;gap:2px;border-bottom:1px solid var(--color-divider)}
.apr-tab{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border:0;background:none;color:color-mix(in srgb,var(--color-text) 65%,transparent);font:inherit;font-size:13.5px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.apr-tab:hover{color:var(--color-text)}
.apr-tab-on,.apr-tab-on:hover{color:var(--apr-good);border-bottom-color:var(--apr-good)}
.apr-ai-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:var(--apr-gap);align-items:start}
.apr-h5{margin:0 0 var(--space-2);font-size:15px;display:flex;align-items:center;gap:7px}
.apr-ul{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-2)}
.apr-li{display:flex;gap:8px;font-size:13.5px;line-height:1.45;align-items:flex-start}
.apr-num{flex:none;width:18px;height:18px;display:grid;place-items:center;font-size:11px;border:1px solid var(--color-accent);color:var(--color-accent);border-radius:50%;margin-top:1px}
.apr-portfolio{min-height:100%}
.apr-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:var(--space-3)}
.apr-metric{display:grid;gap:2px;padding:var(--space-3);border:1px solid var(--color-divider);border-radius:var(--radius-md)}
.apr-metric b{font-size:22px;font-weight:600}
.apr-metric span{font-size:11px;color:color-mix(in srgb,var(--color-text) 55%,transparent)}
.apr-tree{margin:0;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:13px;line-height:1.7;color:color-mix(in srgb,var(--color-text) 85%,transparent);overflow-x:auto}
/* insights column */
.apr-insights{display:flex;flex-direction:column;gap:var(--space-3);position:sticky;top:64px}
.apr-cats{display:grid;gap:var(--space-2)}
.apr-cat{flex-direction:row;display:flex;gap:10px;align-items:center;padding:10px}
.apr-cat-ic{width:32px;height:32px;flex:none;display:grid;place-items:center;border-radius:var(--radius-sm);background:color-mix(in srgb,var(--color-text) 6%,transparent);color:var(--color-accent)}
.apr-cat-bd{flex:1;min-width:0}
.apr-bar{height:4px;border-radius:2px;background:color-mix(in srgb,var(--color-text) 10%,transparent);margin-top:5px;overflow:hidden}
.apr-bar>div{height:100%;border-radius:2px;transition:width .6s ease}
.apr-kv{gap:0}
.apr-kv-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0}
.apr-kv-row+.apr-kv-row{border-top:1px solid color-mix(in srgb,var(--color-text) 7%,transparent)}
/* dashboard / insights pages */
.apr-page{display:flex;flex-direction:column;gap:var(--apr-gap);padding:var(--apr-gap) var(--space-6) var(--space-8)}
.apr-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:var(--apr-gap)}
.apr-stat b{font-size:28px;font-weight:600;line-height:1.1}
.apr-stat span{font-size:12px}
.apr-attn{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--space-3)}
.apr-ins-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:var(--apr-gap);align-items:start}
.apr-ins-repos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--space-3)}
.apr-ins-repo{border:1px solid transparent;cursor:pointer;font:inherit;color:inherit;text-align:left}
.apr-ins-repo:hover{border-color:var(--color-divider)}
@media (max-width:1200px){.apr-review{grid-template-columns:230px minmax(0,1fr)}.apr-insights{display:none}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="reviewer-data.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="reviewer-review.jsx"></script>
<script type="text/babel" src="reviewer-screens.jsx"></script>
<script type="text/babel" src="reviewer-app.jsx"></script>
</body>
</html>
